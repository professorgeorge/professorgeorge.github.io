<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Babu George @ GitHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <style>
        /* "Ember & Sage" palette: warm terracotta + amber accents against an inky
           ink-navy backdrop, with a muted sage secondary tone for contrast. */
        :root {
            --bg-deep: #14110f;
            --bg-mid: #23190f;
            --card: rgba(38, 30, 24, 0.65);
            --accent: #e8935a;
            --accent-strong: #f2b544;
            --accent-soft: rgba(232, 147, 90, 0.14);
            --sage: #8fae8b;
            --sage-soft: rgba(143, 174, 139, 0.16);
            --text-main: #f3ead9;
            --text-muted: #b9a998;
            --border-subtle: rgba(243, 234, 217, 0.09);
            --linkedin: #0a66c2;
            --main-bg: rgba(35, 25, 15, 0.35);
            --card-shadow: 0 10px 30px rgba(0,0,0,0.5);
            --glow-1: rgba(232, 147, 90, 0.16);
            --glow-2: rgba(143, 174, 139, 0.14);
            --bg-floor: #060403;
        }
        :root[data-theme="light"] {
            --bg-deep: #f6f1e7;
            --bg-mid: #fdf8ee;
            --card: rgba(255, 255, 255, 0.7);
            --accent: #c9622f;
            --accent-strong: #b8860b;
            --accent-soft: rgba(201, 98, 47, 0.1);
            --sage: #4f7a5a;
            --sage-soft: rgba(79, 122, 90, 0.14);
            --text-main: #2a2118;
            --text-muted: #6b5d4d;
            --border-subtle: rgba(42, 33, 24, 0.1);
            --linkedin: #0a66c2;
            --main-bg: rgba(255, 255, 255, 0.45);
            --card-shadow: 0 10px 30px rgba(0,0,0,0.12);
            --glow-1: rgba(201, 98, 47, 0.1);
            --glow-2: rgba(79, 122, 90, 0.1);
            --bg-floor: #fffdf7;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Manrope', system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(circle at 15% 0%, var(--glow-1) 0, transparent 45%),
                radial-gradient(circle at 85% 15%, var(--glow-2) 0, transparent 50%),
                radial-gradient(circle at top, var(--bg-mid) 0, var(--bg-deep) 60%, var(--bg-floor) 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .page { width: 100%; max-width: 1000px; padding: 3rem 1.5rem; }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
            margin-bottom: 3rem;
            animation: fadeIn 0.8s ease-out;
        }
        .profile-section { display: flex; align-items: center; gap: 1.5rem; }
        .avatar {
            width: 80px; height: 80px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong), var(--sage));
            box-shadow: 0 0 24px rgba(232, 147, 90, 0.35);
        }
        .title-block h1 {
            margin: 0; font-size: 2.3rem; letter-spacing: -0.03em;
            font-family: 'Fraunces', serif; font-weight: 700;
            background: linear-gradient(100deg, var(--text-main) 30%, var(--accent) 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .subtitle { margin: 0.35rem 0 0; color: var(--text-muted); font-size: 1rem; letter-spacing: 0.01em; }

        .btn-linkedin {
            display: inline-flex; align-items: center; gap: 0.6rem;
            background: var(--linkedin); color: white;
            text-decoration: none; padding: 0.6rem 1.2rem;
            border-radius: 999px; font-weight: 600; font-size: 0.9rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-linkedin:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(10, 102, 194, 0.4); }

        .header-actions { display: flex; align-items: center; gap: 0.75rem; }
        .btn-theme {
            display: inline-flex; align-items: center; justify-content: center;
            width: 2.6rem; height: 2.6rem;
            background: var(--card); color: var(--text-main);
            border: 1px solid var(--border-subtle);
            border-radius: 50%; cursor: pointer; font-size: 1.2rem;
            transition: transform 0.2s, border-color 0.2s, background-color 0.3s ease;
        }
        .btn-theme:hover { transform: scale(1.08) rotate(15deg); border-color: var(--accent); }

        main {
            background: var(--main-bg);
            backdrop-filter: blur(14px);
            border-radius: 1.5rem;
            border: 1px solid var(--border-subtle);
            padding: 2rem;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        #sites {
            list-style: none; padding: 0; margin: 0;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;
        }
        .site-card {
            background: var(--card);
            border: 1px solid var(--border-subtle);
            border-radius: 1rem;
            padding: 1.2rem;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s, box-shadow 0.3s, background-color 0.3s ease;
            position: relative; overflow: hidden;
        }
        .site-card::before {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(135deg, var(--accent-soft), transparent 60%);
            opacity: 0; transition: opacity 0.3s;
        }
        .site-card:hover::before { opacity: 1; }
        .site-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: var(--accent);
            box-shadow: var(--card-shadow);
        }
        .site-card a { color: var(--accent); text-decoration: none; font-weight: 700; font-size: 1.1rem; position: relative; }
        .badge {
            font-size: 0.65rem; text-transform: uppercase; padding: 0.2rem 0.5rem;
            border-radius: 4px; background: var(--sage-soft); color: var(--sage);
            margin-left: 0.5rem; vertical-align: middle; letter-spacing: 0.04em;
        }
        .repo-desc { margin: 0.8rem 0; font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; position: relative; }
        .repo-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-muted); position: relative; }
        .repo-meta span:last-child { color: var(--accent-strong); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) {
            header { flex-direction: column; align-items: flex-start; gap: 1rem; }
            .header-actions { align-self: flex-start; }
        }
    </style>
</head>
<body>
    <script>
        (function () {
            const stored = localStorage.getItem("theme");
            const theme = stored || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
    <div class="page">
        <header>
            <div class="profile-section">
                <img id="user-avatar" class="avatar" src="https://github.com/professorgeorge.png" alt="Babu George" />
                <div class="title-block">
                    <h1>Babu George @ GitHub</h1>
                    <p class="subtitle">Order in chaos &bull; Strategic Intelligence &bull; AI Ethics</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="theme-toggle" class="btn-theme" type="button" aria-label="Toggle dark and light mode" title="Toggle dark/light mode">🌙</button>
                <a href="https://www.linkedin.com/in/beingbabu/" target="_blank" class="btn-linkedin">
                    Connect on LinkedIn
                </a>
            </div>
        </header>

        <main>
            <ul id="sites"><li style="color: var(--text-muted)">Syncing repositories...</li></ul>
        </main>

        <footer style="margin-top: 2rem; text-align: center; color: var(--text-muted); font-size: 0.8rem;">
            &copy; 2026 Babu George, PhD &bull; Automatically updating from GitHub API
        </footer>
    </div>

    <script>
        const username = "professorgeorge";

        function updateThemeToggleIcon(theme) {
            const btn = document.getElementById("theme-toggle");
            if (btn) btn.textContent = theme === "light" ? "☀️" : "🌙";
        }

        function initThemeToggle() {
            const current = document.documentElement.getAttribute("data-theme") || "dark";
            updateThemeToggleIcon(current);
            const btn = document.getElementById("theme-toggle");
            btn.addEventListener("click", () => {
                const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
                document.documentElement.setAttribute("data-theme", next);
                localStorage.setItem("theme", next);
                updateThemeToggleIcon(next);
            });
        }
        initThemeToggle();

        async function fetchPortfolio() {
            const ul = document.getElementById("sites");
            try {
                let repos = [];
                let page = 1;
                while(true) {
                    const r = await fetch(`https://api.github.com/users/${username}/repos?per_page=100&page=${page}&sort=pushed`);
                    const data = await r.json();
                    if(!data || data.length === 0) break;
                    repos = repos.concat(data);
                    if(data.length < 100) break;
                    page++;
                }

                ul.innerHTML = "";
                repos.sort((a,b) => (b.stargazers_count - a.stargazers_count) || (new Date(b.pushed_at) - new Date(a.pushed_at)));

                const filtered = repos.filter(r => r.has_pages && !r.fork && !r.archived && !r.disabled);

                filtered.forEach(repo => {
                    const card = document.createElement("li");
                    card.className = "site-card";
                    const url = repo.name === `${username}.github.io`
                        ? `https://${username}.github.io`
                        : `https://${username}.github.io/${repo.name}`;

                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <a href="${url}" target="_blank">${repo.name}</a>
                            <span class="badge">Live</span>
                        </div>
                        <p class="repo-desc">${repo.description || "Experimental work in progress."}</p>
                        <div class="repo-meta">
                            <span>${repo.language || "Open Source"}</span>
                            <span>⭐ ${repo.stargazers_count}</span>
                        </div>
                    `;
                    ul.appendChild(card);
                });

                if (filtered.length === 0) {
                    ul.innerHTML = "<li style='color: var(--text-muted)'>No published sites yet.</li>";
                }
            } catch (e) {
                ul.innerHTML = "<li>Offline. Check back later!</li>";
            }
        }
        fetchPortfolio();
    </script>
</body>
</html>
