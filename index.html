<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My GitHub Pages Sites</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0f172a;
      --bg-alt: #020617;
      --card: #020617;
      --accent: #38bdf8;
      --accent-soft: rgba(56,189,248,0.12);
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --border-subtle: #1f2937;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e293b 0, #020617 55%, #000 100%);
      color: var(--text-main);
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 960px;
      padding: 2.5rem 1.5rem 3rem;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .title-block {
      max-width: 560px;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(2rem, 2.8vw, 2.6rem);
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, #f97316, #ef4444 60%, #7c2d12 100%);
      box-shadow: 0 0 16px rgba(248, 113, 113, 0.6);
    }

    .subtitle {
      margin: 0;
      font-size: 0.98rem;
      color: var(--text-muted);
    }

    .meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.35rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: right;
    }

    .pill {
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.4);
      background: linear-gradient(135deg, rgba(15,23,42,0.9), rgba(15,23,42,0.4));
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
    }

    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34,197,94,0.8);
    }

    main {
      background: radial-gradient(circle at top left, #111827, #020617 60%);
      border-radius: 1.25rem;
      border: 1px solid rgba(148,163,184,0.3);
      box-shadow:
        0 22px 60px rgba(15,23,42,0.85),
        0 0 0 1px rgba(15,23,42,0.7);
      padding: 1.4rem 1.4rem 1.6rem;
      position: relative;
      overflow: hidden;
    }

    main::before {
      content: "";
      position: absolute;
      inset: -1px;
      pointer-events: none;
      border-radius: inherit;
      border: 1px solid rgba(148,163,184,0.35);
      mix-blend-mode: screen;
      opacity: 0.55;
    }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.9rem;
    }

    .list-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .divider {
      height: 1px;
      background: linear-gradient(
        to right,
        rgba(148,163,184,0.1),
        rgba(148,163,184,0.5),
        rgba(148,163,184,0.1)
      );
      margin: 0.5rem 0 0.9rem;
    }

    #sites {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 0.9rem;
    }

    li.site {
      position: relative;
      padding: 0.85rem 0.9rem;
      border-radius: 0.85rem;
      background: radial-gradient(circle at top left, #020617, #020617 65%);
      border: 1px solid rgba(31,41,55,0.9);
      box-shadow: 0 14px 30px rgba(0,0,0,0.6);
      transition:
        transform 150ms ease,
        box-shadow 150ms ease,
        border-color 150ms ease,
        background 150ms ease;
    }

    li.site:hover {
      transform: translateY(-3px);
      border-color: rgba(56,189,248,0.7);
      box-shadow:
        0 22px 40px rgba(15,23,42,0.9),
        0 0 0 1px rgba(15,23,42,0.9);
      background: radial-gradient(circle at top left, #020617, #020617 45%, #020617 100%);
    }

    li.site a {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-weight: 500;
      font-size: 0.98rem;
      color: var(--accent);
      text-decoration: none;
    }

    li.site a:hover {
      text-decoration: underline;
    }

    .host-badge {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.4);
      padding: 0.05rem 0.5rem;
      background: rgba(15,23,42,0.7);
    }

    .desc {
      margin-top: 0.35rem;
      font-size: 0.83rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .url {
      margin-top: 0.3rem;
      font-size: 0.78rem;
      color: #6b7280;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      word-break: break-all;
    }

    .empty-state {
      font-size: 0.95rem;
      color: var(--text-muted);
      padding: 0.75rem 0.2rem;
    }

    footer {
      margin-top: 1.6rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      .page {
        padding-inline: 1.1rem;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }

      .meta {
        align-items: flex-start;
        text-align: left;
      }

      main {
        padding: 1.1rem 1rem 1.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="title-block">
        <h1><span class="dot"></span>My GitHub Pages sites</h1>
        <p class="subtitle">
          Experiments from my inexperience
        </p>
      </div>
      <div class="meta">
        <div class="pill">
          <span class="pill-dot"></span>
          Live from GitHub Pages
        </div>
        <span>Generated from repositories with Pages enabled.</span>
      </div>
    </header>

    <main>
      <div class="list-header">
        <div class="list-title">Sites</div>
      </div>
      <div class="divider"></div>
      <ul id="sites">
        <li class="empty-state">Loading sites…</li>
      </ul>
    </main>

    <footer>
      <span>Last updated live from the GitHub API.</span>
      <span>Built by <a href="https://www.linkedin.com/in/beingbabu/" target="_blank" rel="noopener noreferrer">Babu George, PhD</a></span>
    </footer>
  </div>

  <script>
    const username = "professorgeorge";

    async function loadSites() {
      const ul = document.getElementById("sites");
      ul.innerHTML = '<li class="empty-state">Loading sites…</li>';

      try {
        const resp = await fetch(`https://api.github.com/users/${username}/repos?per_page=100`);
        const repos = await resp.json();
        const pagesRepos = repos.filter(r => r.has_pages);

        ul.innerHTML = "";

        if (pagesRepos.length === 0) {
          ul.innerHTML = '<li class="empty-state">No GitHub Pages sites found.</li>';
          return;
        }

        pagesRepos.forEach(repo => {
          const li = document.createElement("li");
          li.className = "site";

          let siteUrl;
          if (repo.name === `${username}.github.io`) {
            siteUrl = `https://${username}.github.io`;
          } else {
            siteUrl = `https://${username}.github.io/${repo.name}`;
          }

          const link = document.createElement("a");
          link.href = siteUrl;
          link.textContent = repo.name;

          const hostBadge = document.createElement("span");
          hostBadge.className = "host-badge";
          hostBadge.textContent = "GitHub Pages";

          const desc = document.createElement("div");
          desc.className = "desc";
          desc.textContent = repo.description || "No description provided.";

          const url = document.createElement("div");
          url.className = "url";
          url.textContent = siteUrl;

          li.appendChild(link);
          li.appendChild(hostBadge);
          li.appendChild(desc);
          li.appendChild(url);
          ul.appendChild(li);
        });
      } catch (e) {
        ul.innerHTML = '<li class="empty-state">Could not load sites right now. Try again later.</li>';
      }
    }

    loadSites();
  </script>
</body>
</html>
