<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Babu George @ GitHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root {
            --bg: #0f172a;
            --bg-alt: #020617;
            --card: rgba(15, 23, 42, 0.8);
            --accent: #38bdf8;
            --accent-soft: rgba(56,189,248,0.12);
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
            --border-subtle: rgba(148, 163, 184, 0.1);
            --linkedin: #0a66c2;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top, #1e293b 0, #020617 55%, #000 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }
        .page { width: 100%; max-width: 1000px; padding: 3rem 1.5rem; }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
            margin-bottom: 3rem;
            animation: fadeIn 0.8s ease-out;
        }
        .profile-section { display: flex; align-items: center; gap: 1.5rem; }
        .avatar {
            width: 80px; height: 80px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            background: #1e293b;
        }
        .title-block h1 { margin: 0; font-size: 2.2rem; letter-spacing: -0.04em; }
        .subtitle { margin: 0.2rem 0 0; color: var(--text-muted); font-size: 1rem; }
        
        .btn-linkedin {
            display: inline-flex; align-items: center; gap: 0.6rem;
            background: var(--linkedin); color: white;
            text-decoration: none; padding: 0.6rem 1.2rem;
            border-radius: 999px; font-weight: 600; font-size: 0.9rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-linkedin:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(10, 102, 194, 0.4); }

        main {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            border: 1px solid var(--border-subtle);
            padding: 2rem;
        }
        #sites {
            list-style: none; padding: 0; margin: 0;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;
        }
        .site-card {
            background: var(--card);
            border: 1px solid var(--border-subtle);
            border-radius: 1rem;
            padding: 1.2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; overflow: hidden;
        }
        .site-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .site-card a { color: var(--accent); text-decoration: none; font-weight: 700; font-size: 1.1rem; }
        .badge {
            font-size: 0.65rem; text-transform: uppercase; padding: 0.2rem 0.5rem;
            border-radius: 4px; background: var(--accent-soft); color: var(--accent);
            margin-left: 0.5rem; vertical-align: middle;
        }
        .repo-desc { margin: 0.8rem 0; font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; }
        .repo-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-muted); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) {
            header { flex-direction: column; align-items: flex-start; gap: 1rem; }
            .btn-linkedin { align-self: flex-start; }
        }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <div class="profile-section">
                <img id="user-avatar" class="avatar" src="https://github.com/professorgeorge.png" alt="Babu George" />
                <div class="title-block">
                    <h1>Babu George @ GitHub</h1>
                    <p class="subtitle">Order in chaos • Strategic Intelligence • AI Ethics</p>
                </div>
            </div>
            <a href="https://www.linkedin.com/in/beingbabu/" target="_blank" class="btn-linkedin">
                Connect on LinkedIn
            </a>
        </header>

        <main>
            <ul id="sites"><li style="color: var(--text-muted)">Syncing repositories...</li></ul>
        </main>

        <footer style="margin-top: 2rem; text-align: center; color: var(--text-muted); font-size: 0.8rem;">
            &copy; 2026 Babu George, PhD • Automatically updating from GitHub API
        </footer>
    </div>

    <script>
        const username = "professorgeorge";
        async function fetchPortfolio() {
            const ul = document.getElementById("sites");
            try {
                let repos = [];
                let page = 1;
                while(true) {
                    const r = await fetch(`https://api.github.com/users/${username}/repos?per_page=100&page=${page}&sort=pushed`);
                    const data = await r.json();
                    if(!data || data.length === 0) break;
                    repos = repos.concat(data);
                    if(data.length < 100) break;
                    page++;
                }
                
                ul.innerHTML = "";
                repos.sort((a,b) => (b.stargazers_count - a.stargazers_count) || (new Date(b.pushed_at) - new Date(a.pushed_at)));

                repos.forEach(repo => {
                    const card = document.createElement("li");
                    card.className = "site-card";
                    const url = repo.has_pages 
                        ? (repo.name === `${username}.github.io` ? `https://${username}.github.io` : `https://${username}.github.io/${repo.name}`)
                        : repo.html_url;

                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <a href="${url}" target="_blank">${repo.name}</a>
                            <span class="badge">${repo.has_pages ? 'Live' : 'Code'}</span>
                        </div>
                        <p class="repo-desc">${repo.description || "Experimental work in progress."}</p>
                        <div class="repo-meta">
                            <span>${repo.language || "Open Source"}</span>
                            <span>⭐ ${repo.stargazers_count}</span>
                        </div>
                    `;
                    ul.appendChild(card);
                });
            } catch (e) {
                ul.innerHTML = "<li>Offline. Check back later!</li>";
            }
        }
        fetchPortfolio();
    </script>
</body>
</html>
